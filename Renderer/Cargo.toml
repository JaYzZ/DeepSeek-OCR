[package]
name = "vello_renderer"
version = "0.1.0"
edition = "2021"

[lib]
name = "vello_renderer"
crate-type = ["cdylib"]

[dependencies]
# Latest Vello for GPU rendering
vello = "0.6"

# Latest wgpu for GPU access
wgpu = "27"

# Latest cosmic-text for text layout
cosmic-text = "0.15"

# Python bindings - latest
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py38"] }
numpy = "0.27"

# Image handling - latest
image = "0.25"

# Utilities
anyhow = "1.0"
pollster = "0.4"

# Parallel processing
rayon = "1.10"

# Text rasterization
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
