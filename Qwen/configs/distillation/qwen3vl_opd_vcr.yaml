runtime_env_config: Qwen/configs/qwen3vl_runtime_env.yaml

system_prompt: ""
image_max_pixels: 262144
video_max_pixels: 16384

model:
  model_name_or_path: ../../huggingface/Qwen/Qwen3-VL-2B-Thinking
  adapter_name_or_path: null
  dtype: bf16
  attn_implementation: flash_attention_2
  freeze_vision_tower: true
  gradient_checkpointing: true

lora:
  enable: true
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj

data:
  dataset_names: r1ov_thinking,deepvision_thinking
  manifest_builder: opd_text
  opsd_manifest: null
  overwrite_manifest: false

prompts:
  max_teacher_rationale_images: 0
  student_user: |
    Question:
    {question_text}
  teacher_user: |
    Question:
    {question_text}

    Here is a reference reasoning to this question:
    === Reference Reasoning Start ===
    {reference_reasoning_text}
    === Reference Reasoning End ===

    After reading the reference reasoning above, make sure you truly understand the reasoning behind each step. Do not copy or paraphrase it. Now, using your own words and independent reasoning, derive the same final answer.

teacher:
  rollout_source: shared_student
  vllm_thinking: false
  max_new_tokens: 32768
  temperature: 0.0
  top_p: 1.0
  top_k: 1
  repetition_penalty: 1.0
  sync_steps: 1
  gpu_memory_utilization: 0.6
  enable_sleep_mode: false
  enforce_eager: true
  max_images_per_prompt: 10

distillation:
  max_chars_per_chunk: 4800
  skip_empty_thinking: true
  replay_render:
    min_font_size: 10.0
    max_font_size: 10.0
    strip_leading_indentation: true
    collapse_multi_blank_lines: true
    normalize_bullet_prefixes: true
    collapse_all_whitespace: true
    compact_layout: true

student_loss:
  loss_type: ce+vae+mse:0.3
  latent_aux_loss_source: hidden
  vae_trainable: true
  latent_ce_active: false
  latent_ce_token: false
  hidden_states_hook: false

generation:
  max_new_tokens: 32768
  min_continuous_steps: 0
  max_continuous_steps: null
  do_sample: true
  temperature: 1.0
  top_p: 1.0
  top_k: 20
  repetition_penalty: 1.0

rollout:
  enable: true
  backend: vllm
  tensor_parallel_size: 1
  sync_steps: 1
  gpu_memory_utilization: 0.6
  enable_sleep_mode: true
  enforce_eager: false
  max_images_per_prompt: 10
  max_model_len: 49152

training:
  output_dir: Qwen/checkpoints/qwen3vl-2b/lora/opd_vcr_continuous
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_workers: 4
  drop_last: true
  seed: 42
  learning_rate: 1.0e-5
  weight_decay: 0.0
  num_train_epochs: 2
  max_steps: -1
  warmup_ratio: 0.05
  save_steps: 10
  save_total_limit: 2
  logging_steps: 1
  bf16: true
  max_length: 16384
  max_grad_norm: 1.0
