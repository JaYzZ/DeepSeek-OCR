### Qwen3VL runtime env contract
# This file is the default source of truth for runtime env values used by the
# active Qwen pipeline:
# - training wrappers
# - backfill transparent eval
# - vLLM server
# - benchmark evaluation / unified inference
#
# Precedence:
# 1. shell/exported env var
# 2. QWEN3VL_RUNTIME_ENV_CONFIG (if pointed at another yaml)
# 3. this file
#
# Training-only settings that belong to the main train config should stay in the
# training yaml, not here (for example dataloader_num_workers).

### latent supervision / special tokens
# Shared token IDs consumed by training, backfill, and the vLLM thinking plugin.
latent_supervision: 1
latent_token_id: 151669
thinking_start_id: 151667
thinking_end_id: 151668
thinking_sep_id: 151670

### latent objective runtime
loss_type: ce+embed_ce+vae+mse+ot
latent_aux_loss_source: vae_sample
latent_step_ce_token: 0
# 0 => use sampled CoT token IDs at latent-step CE positions (default)
# 1 => force <latent> token ID at latent-step CE positions
match_strategy: truncate
max_new_tokens: 40960
vae_intermediate_size: 512

### curriculum
curriculum_enable: 1
curriculum_epochs: 0
curriculum_loss_types: ce+embed_ce+vae:0.0+mse:0.4+ot:0.4
curriculum_latent_step_ce: 1

### backfill / transparent eval
# Used by post-training backfill and transparent eval callbacks.
eval_max_new_tokens: 8192
backfill_enable: 1

### post-training benchmark
# Used by the training wrappers when they optionally launch benchmark eval.
benchmark_enable: 1
benchmark_list: MathVision,MMMU,RealWorldQA
benchmark_num_samples: 100
benchmark_server_concurrency: 16

### vLLM runtime
# These control whether continuous hidden-state AR is enabled at inference time.
vllm_thinking: 1
vllm_enforce_eager: 0
vllm_force_think: 0
min_continuous_steps: 0

### model/runtime behavior
compile_vision_only: 1

### diagnostics
hidden_states_hook: 1

### torch / allocator
cuda_alloc_conf: expandable_segments:True
