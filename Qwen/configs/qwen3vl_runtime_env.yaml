### qwen3vl latent supervision runtime envs
# Unified special-token IDs shared by training and vLLM plugin.
latent_supervision: 1
latent_token_id: 151669
thinking_start_id: 151667
thinking_end_id: 151668
thinking_sep_id: 151670

loss_type: vae+ot+pre_think_mse
match_strategy: truncate
thinking_loss_weight: 1.0
pred_embed_forward_weight: 1.0
# Align with Qwen3-VL official thinking setting: out_seq_length=40960.
max_new_tokens: 40960
vae_intermediate_size: 512

### curriculum
curriculum_enable: 1
curriculum_epochs: 0,1,2
curriculum_loss_types: vae+pre_think_mse,vae+pre_think_mse,vae+ot+pre_think_mse
curriculum_weights: 1.0,1.0,1.0
curriculum_latent_step_ce: 1,1,1
latent_step_ce_loss: 0
latent_step_ce_token: 0
# 0 => use sampled CoT token IDs at latent-step CE positions (default)
# 1 => force <latent> token ID at latent-step CE positions

### data / eval
eval_max_new_tokens: 8192
backfill_enable: 1

### post-training benchmark
benchmark_enable: 1
benchmark_list: MathVision,RealWorldQA
benchmark_num_samples: 100

### perf / debug
vllm_thinking: 1
vllm_enforce_eager: 0
vllm_force_think: 0
min_continuous_steps: 0
compile_vision_only: 1
debug_forward: 0
log_hidden_states_gradient: 0
hidden_states_hook: 1
cuda_alloc_conf: expandable_segments:True
