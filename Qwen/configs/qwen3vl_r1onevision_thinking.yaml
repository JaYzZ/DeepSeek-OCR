### model
# Qwen3-VL-2B-Thinking with latent supervision for R1-OneVision training.
#
# Sequence format:
# - Assistant target is `<think><latent>...<think_sep>... </think>{answer}`.
# - In this dataset, most samples are single-step, so the common case is
#   `<think><latent></think>{answer}` (no `<think_sep>` present).
#
# Token / latent handling at train time:
# 1. The collator expands each `<latent>` token to match the latent sequence length
#    recorded in `latent_seq_lens` / `latent_ground_truth`.
# 2. The expanded positions receive injected latent embeddings from
#    `latent_ground_truth`.
# 3. Main full-sequence CE still supervises the structural scaffold:
#    `<think>`, `</think>`, and `<think_sep>` when present.
# 4. Optional latent-step CE on the expanded latent region is controlled by the
#    shared runtime env (`qwen3vl_runtime_env.yaml`, used by train/backfill/server):
#    - latent-step CE on expanded latent positions is controlled by curriculum
#      in the main process.
#    - `latent_ce_token=0` uses the prebuilt `cot_chunk_token_ids`.
#    - `latent_ce_token=1` forces `<latent>` labels on those positions.
#
# Hidden-state losses:
# - `mse/repa` compare shifted hidden states against `latent_ground_truth`.
# - `ot/nce` compare shifted hidden states to `latent_supervision`.
# - `vae` enables the latent VAE on the shifted prev-hidden -> next-latent path.
# - `vae_ce` optionally adds the auxiliary `pred_embed_forward` CE pass.
#
# Key differences from OCRVL / DPSK-based setups:
# - Qwen3-VL vision tower, no OCRVL wrapper or DPSK encoder in this run.
# - Question text stays in the normal chat sequence.
# - Direct hidden-state supervision, no reverse projection head.
model_name_or_path: ../../huggingface/Qwen/Qwen3-VL-2B-Thinking
add_special_tokens: "<latent>,<think_sep>"
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
do_eval: false  # Transparent eval is run later via backfill; no in-trainer eval loop here.
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true

### dataset
# Dataset columns expected by the patched collator / latent forward path:
# - `messages`: standard ShareGPT chat sequence
# - `images`: question image path(s)
# - `latent_ground_truth`: one latent tensor path per thinking chunk
# - `latent_supervision`: optional hidden-state supervision targets
# - `latent_seq_lens`: expanded latent lengths, used to size latent expansion without
#   loading tensors in dataloader workers
# - `cot_chunk_token_ids`: one tokenized CoT chunk per latent step, used when
#   `latent_ce_token=0`
# - `num_latent_steps`: number of thinking chunks (`<think_sep>` count + 1)
# Unified latent SFT: always train on both R1-OneVision and encoded DeepVision-103K.
dataset: r1_onevision_thinking,deepvision_thinking
dataset_dir: Qwen/data
template: qwen3vl_latent
cutoff_len: 8192
max_samples: null
streaming: false
packing: false
mix_strategy: concat
overwrite_cache: false
preprocessing_num_workers: 8
dataloader_num_workers: 8
dataloader_prefetch_factor: 8

### output
output_dir: Qwen/checkpoints/qwen3vl-2b/lora/r1ov_deepvision_thinking
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
log_level: info
use_swanlab: true
swanlab_mode: cloud
swanlab_project: qwen3vl-r1ov-deepvision

### train
per_device_train_batch_size: 32
gradient_accumulation_steps: 2
dataloader_drop_last: true
learning_rate: 2.0e-4
# Total training epochs are derived by the wrapper from curriculum boundaries
# when `curriculum_epochs` is a comma-separated boundary list.
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
pure_bf16: true
gradient_checkpointing: false
dataloader_pin_memory: true
dataloader_persistent_workers: true

# FSDP configuration for LoRA + latent-VAE training.
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  activation_checkpointing: true
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  transformer_layer_cls_to_wrap:
    - "Qwen3VLTextDecoderLayer"
    - "Qwen3VLVisionBlock"
    - "Qwen3VLVisionPatchMerger"
  ignored_modules: "model\\.visual(\\..*)?"
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true  # Required for summon_full_params with LoRA / extra modules.
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true
  fsdp_state_dict_type: full_state_dict

ddp_find_unused_parameters: false
ddp_timeout: 180000000
resume_from_checkpoint: null
adapter_name_or_path: null
