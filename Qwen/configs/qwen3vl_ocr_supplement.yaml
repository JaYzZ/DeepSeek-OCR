### model
# OCR-Centric Supplement Training for Qwen3VL Native
#
# This config supplements the VQA/caption-dominated unified SFT with OCR-specific tasks.
# Trained on top of existing unified SFT checkpoint.
#
# Tasks included:
# - bbox_ocr: Transcribe text within bounding boxes
# - full_document_ocr: Complete document transcription
# - markdown_conversion: Convert documents to markdown format
# - caption_render_ocr: Rendered text OCR (alignment)
#
# Goal: Enhance OCR capabilities on top of general VQA/caption foundation
#
# Special thinking tokens (present in base model):
# - <think> (151667): Opens thinking/reasoning section
# - </think> (151668): Closes thinking/reasoning section
model_name_or_path: /share/project/xiyan/huggingface/Qwen/Qwen3-VL-2B-Thinking
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
disable_gradient_checkpointing: true

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj
freeze_vision_tower: true

### dataset
# OCR-Centric Supplement Training
#
# Uses only OCR-focused tasks from existing unified SFT dataset:
# - bbox_ocr: ~800K samples - Transcribe text in bounding boxes
# - full_document_ocr: ~80K samples - Complete document transcription
# - markdown_conversion: ~80K samples - Convert to markdown
# - caption_render_ocr: ~558K samples - Rendered text OCR alignment
# Total: ~1.5M OCR-focused samples (37% of full unified SFT)
#
# Data source: Pre-filtered from OCRVL/data/ocrvl_unified_sft.jsonl
# To create the filtered dataset (one-time setup):
#   python Qwen/scripts/filter_ocr_subset.py
#
# This creates Qwen/data/ocrvl_ocr_supplement.jsonl without rebuilding from source.
dataset: ocrvl_ocr_supplement
dataset_dir: /share/project/xiyan/sources/DeepSeek-OCR/Qwen/data
template: qwen3vl
cutoff_len: 2048
max_samples: null
streaming: false
packing: true
preprocessing_num_workers: 4
dataloader_num_workers: 4

### eval
# Use transparent eval (includes OCR tasks for validation)
eval_dataset: ocrvl_transparent_eval
eval_dataset_dir: /share/project/xiyan/sources/DeepSeek-OCR/OCRVL/data
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
predict_with_generate: true

### output
output_dir: /share/project/xiyan/sources/DeepSeek-OCR/Qwen/checkpoints/qwen3vl-2b/lora/ocr_supplement
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
dataloader_drop_last: true
learning_rate: 2.0e-4
num_train_epochs: 2.0  # Fewer epochs for supplement training
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
pure_bf16: true

# FSDP configuration
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_auto_wrap_policy: SIZE_BASED_WRAP
  fsdp_min_num_params: 100000
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true

ddp_find_unused_parameters: false
ddp_timeout: 180000000

# Load from previous unified SFT checkpoint
adapter_name_or_path: /share/project/xiyan/sources/DeepSeek-OCR/Qwen/checkpoints/qwen3vl-2b/lora/native_unified_sft
