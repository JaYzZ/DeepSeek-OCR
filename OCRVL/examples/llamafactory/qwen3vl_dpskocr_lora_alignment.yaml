### model
# Unified checkpoint with both language model and DeepSeek-OCR encoder in one directory
# - Root: Qwen3-VL language model (model.safetensors)
# - dpsk_ocr_encoder/: DeepSeek-OCR vision encoder (model-00001-of-000001.safetensors)
model_name_or_path: /share/project/xiyan/sources/DeepSeek-OCR/OCRVL/checkpoints/OCR-Qwen3-VL-2B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
disable_gradient_checkpointing: true  # Required for FSDP compatibility

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
# Target LLM layers only (exclude vision to avoid PEFT errors)
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj

# Train OCRVL connector modules alongside LoRA adapters.
# NOTE: Do not include `thinking_projection` unless you are running a latent-supervision stage,
# otherwise it will be unused and can hang DDP/FSDP when `ddp_find_unused_parameters=false`.
additional_target: model.ocr_connector,model.ocr_deepstack_connector

# Freeze vision components
freeze_vision_tower: true

### dataset
# Training dataset: LLaVA-Pretrain 558K + DocLayNet 69K = ~627K total
# - LLaVA-Pretrain: Natural images with captions (blip_laion_cc_sbu_558k)
# - DocLayNet: OCR-heavy document layouts (train split)
dataset: ocrvl_alignment_prerendered
dataset_dir: OCRVL/llamafactory/data
template: ocrvl_qwen3_vl_nothink
cutoff_len: 2048
# Leave unset/null to use full generated dataset.
max_samples: null
# Disable streaming mode - use epoch control with patched tokenization
# OCRVL template avoids eager image loading during tokenization
streaming: false
# Enable sequence packing to reduce padding waste
packing: true
# Standard preprocessing workers for non-streaming mode
preprocessing_num_workers: 16
dataloader_num_workers: 8

### eval
# Use separate eval dataset for transparent evaluation
eval_dataset: ocrvl_transparent_eval
# Use separate eval dataset (don't split training data)
val_size: 0
# Native LlamaFactory evaluation with generate
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200  # Run transparent evaluation every 200 steps
# Save predictions for custom reformatting
predict_with_generate: true

### output
# Base output directory (timestamp will be added automatically by training script)
# Or override via command line: output_dir=path/to/checkpoint
output_dir: OCRVL/checkpoints/llamafactory/qwen3vl-2b/lora/alignment
logging_steps: 10
save_steps: 200
plot_loss: true
overwrite_output_dir: false  # Don't overwrite existing checkpoints
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4  # 4 × 8 GPUs = 32 global batch (reduced for OOM)
gradient_accumulation_steps: 8  # 8 grad accum to maintain 256 effective batch
dataloader_drop_last: true
learning_rate: 1.0e-3
num_train_epochs: 1.0  # Epoch control (not max_steps)
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# pure_bf16 keeps trainable params in bfloat16 (required for FSDP uniform dtype)
pure_bf16: true
# FSDP configuration (8 GPUs recommended).
# sitecustomize.py patches PEFT auto-wrap policy for this custom model.
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_auto_wrap_policy: SIZE_BASED_WRAP
  fsdp_min_num_params: 100000
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true
ddp_find_unused_parameters: false
ddp_timeout: 180000000
resume_from_checkpoint: null
