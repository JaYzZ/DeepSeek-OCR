### OCRVL multi-stage config (LlamaFactory-style)
#
# This mirrors LlamaFactory's `examples/train_lora/qwen3vl_lora_sft.yaml` layout,
# but drives OCRVL's 3-stage pipeline (alignment -> instruction -> optional thinking).
#
# Usage:
#   bash OCRVL/scripts/train_llava.sh OCRVL/examples/llamafactory/train_llava_pipeline.yaml
#
# Override any field with `key=value` (dot paths), e.g.:
#   bash OCRVL/scripts/train_llava.sh OCRVL/examples/llamafactory/train_llava_pipeline.yaml \
#     system.cuda_visible_devices=0,1 phase2.train.num_train_epochs=1

### run
run:
  run_name: llava_{timestamp}
  root_dir: OCRVL/checkpoints/{run_name}

### system
# Prefer this over NUM_GPUS/GPU_IDS; it matches LlamaFactory usage.
system:
  cuda_visible_devices: 0,1,2,3,4,5,6,7
  tmux_session_name: ocrvl_llava

### validation
validation:
  validation_images: true
  llava_image_base: /share/project/xiyan/huggingface/liuhaotian/LLaVA-Instruct-150K/images
  doclaynet_png_base: /share/project/xiyan/huggingface/docling-project/DocLayNet/PNG

### phase1 (alignment)
phase1:
  method:
    finetuning_type: full  # full=connectors only (no LoRA); lora=LoRA + connectors
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.05
    do_eval: true
  dataset:
    dataset_type: blip3o
    blip3o_dataset: long
    dataset_pct: 0.05
  train:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-3
    num_train_epochs: 1
  output:
    output_dir: "{root_dir}/alignment"
    eval_steps: 500
    evaluation_strategy: steps
    per_device_eval_batch_size: 4

### phase2 (instruction SFT on LLaVA)
phase2:
  method:
    finetuning_type: lora
    lora_rank: 8
    lora_alpha: 16
    lora_dropout: 0.05
    do_eval: true
  dataset:
    llava_json_path: /share/project/xiyan/huggingface/liuhaotian/LLaVA-Instruct-150K/llava_v1_5_mix665k.json
    llava_image_dir: /share/project/xiyan/huggingface/liuhaotian/LLaVA-Instruct-150K/images
    render_questions: true
  train:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    num_train_epochs: 3
  output:
    output_dir: "{root_dir}/instruction"
    eval_steps: 500
    evaluation_strategy: steps
    per_device_eval_batch_size: 4

### phase3 (optional thinking training on LLaVA-CoT)
phase3:
  enabled: false
  method:
    finetuning_type: lora
    do_eval: true
  dataset:
    thinking_jsonl: /share/project/xiyan/huggingface/Xkev/LLaVA-CoT-100k/train.jsonl
    thinking_image_dir: /share/project/xiyan/huggingface
  train:
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 8
    learning_rate: 1.0e-4
    num_train_epochs: 1
    thinking_loss_weight: 1.0
    max_samples: 100000
  output:
    output_dir: "{root_dir}/thinking"
    eval_steps: 500
    evaluation_strategy: steps
    per_device_eval_batch_size: 4
