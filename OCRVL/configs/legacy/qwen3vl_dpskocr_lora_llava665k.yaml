### model
# Stage 2: VQA training - Load Stage 1 connector checkpoint + train LoRA + connectors
model_name_or_path: /share/project/xiyan/sources/DeepSeek-OCR/OCRVL/checkpoints/OCR-Qwen3-VL-2B
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
disable_gradient_checkpointing: true  # Required for FSDP compatibility

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
# Target LLM layers for LoRA
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj

# Train OCRVL connector modules alongside LoRA adapters.
# Connectors will be loaded from Stage 1 checkpoint (alignment stage)
additional_target: model.ocr_connector,model.ocr_deepstack_connector

# Freeze vision components
freeze_vision_tower: true

### dataset
# LLaVA-Instruct-665K: VQA conversations for instruction tuning
# - LLaVA-v1.5 mix665k: ~665K instruction-following samples
dataset: ocrvl_llava_mix665k
dataset_dir: OCRVL/data
# Use data directory as media_dir to access conv_histories and other images
media_dir: OCRVL/data
template: ocrvl_qwen3_vl_nothink
cutoff_len: 2048
# Leave unset/null to use full dataset (~665K samples)
# Set to small value (e.g., 1000) for quick testing
max_samples: null
# Streaming mode: Skip slow upfront tokenization that loads images
# Images are tokenized/loaded on-the-fly during training instead (much faster startup)
streaming: false
# Enable sequence packing to reduce padding waste
packing: true
# Reduce workers for streaming (no need for parallel preprocessing)
preprocessing_num_workers: 1
dataloader_num_workers: 2

### eval
# Use transparent evaluation dataset (14 samples with ground truth)
eval_dataset: ocrvl_transparent_eval
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
# Save predictions for custom reformatting
predict_with_generate: true

### output
# Base output directory (timestamp will be added automatically by training script)
# Or override via command line: output_dir=path/to/checkpoint
output_dir: OCRVL/checkpoints/llamafactory/qwen3vl-2b/lora/llava665k
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false  # Don't overwrite existing checkpoints
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
dataloader_drop_last: true
learning_rate: 2.0e-4  # Lower LR for Stage 2 (LoRA + connector fine-tuning)
num_train_epochs: 3.0  # 3 epochs for VQA instruction tuning
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
pure_bf16: true
# FSDP configuration (8 GPUs)
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_auto_wrap_policy: SIZE_BASED_WRAP
  fsdp_min_num_params: 100000
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true
ddp_find_unused_parameters: false
ddp_timeout: 180000000

# Load Stage 1 checkpoint (connector weights from alignment stage)
# Use adapter_name_or_path to load only weights (not trainer_state.json)
# This ensures eval_steps/save_steps from this config are used (not inherited from Stage 1)
adapter_name_or_path: OCRVL/checkpoints/llamafactory/qwen3vl-2b/lora/alignment/checkpoint-311
