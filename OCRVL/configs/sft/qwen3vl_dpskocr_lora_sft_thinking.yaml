### model
# Unified checkpoint with both language model and DeepSeek-OCR encoder in one directory
# - Root: Qwen3-VL-2B-Thinking language model (qwen3_model.safetensors)
# - dpsk_ocr_encoder/: DeepSeek-OCR vision encoder (model-00001-of-000001.safetensors)
#
# The Thinking model includes special tokens for reasoning:
# - `` (151667): Opens thinking/reasoning section
# - `` (151668): Closes thinking/reasoning section
model_name_or_path: OCRVL/checkpoints/OCR-Qwen3-VL-2B-Thinking
image_max_pixels: 262144
video_max_pixels: 16384
trust_remote_code: true
disable_gradient_checkpointing: true  # Required for FSDP compatibility

### method
stage: sft
do_train: true
do_eval: true  # Enable evaluation for transparent eval callback
# Unified SFT: Single-stage training combining alignment and VQA tasks
# This approach reduces task confusion compared to 2-stage training
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
# Target LLM attention/MLP layers for lightweight LoRA adaptation
lora_target: q_proj,v_proj,k_proj,o_proj,gate_proj,up_proj,down_proj

# Train OCR connector modules alongside LoRA adapters
# These connectors project vision features to language model hidden states
additional_target: model.ocr_connector,model.ocr_deepstack_connector

# Freeze vision components (DPSK encoder)
freeze_vision_tower: true

### dataset
# Unified SFT dataset: Alignment + VQA (rendered) + VQA (text) combined in single training run
# - Alignment: Image captioning + OCR (LLaVA-Pretrain 558K × 2 + DocLayNet 69K)
# - VQA (rendered): Conversation-based instruction following with rendered questions (LLaVA-Instruct-665K)
# - VQA (text): Standard VQA with text questions, NO rendering (LLaVA-Instruct-665K)
# - Combined: ~2.5M samples with balanced task distribution
#
# The standard VQA (text) component helps the model learn instruction following
# without the complexity of rendered questions, improving task understanding.
#
# Note: This Thinking model version includes thinking tokens (``/``) for future
# reasoning tasks, but the unified SFT dataset does not use them. The extra tokens
# are harmless and simply won't appear in the training data.
#
# Build the dataset with:
#   bash OCRVL/scripts/train_llamafactory.sh OCRVL/examples/llamafactory/qwen3vl_dpskocr_lora_sft_thinking.yaml
#
# Or control data mixing ratios:
#   OCRVL_UNIFIED_ALIGNMENT_RATIO=1.0 \
#   OCRVL_UNIFIED_VQA_RATIO=0.5 \
#   OCRVL_UNIFIED_STANDARD_VQA_RATIO=1.5 \
#   bash OCRVL/scripts/train_llamafactory.sh OCRVL/examples/llamafactory/qwen3vl_dpskocr_lora_sft_thinking.yaml
dataset: ocrvl_unified_sft
dataset_dir: OCRVL/data
template: ocrvl_qwen3_vl_nothink
cutoff_len: 2048
# Leave unset/null to use full generated dataset (~2.5M samples)
# Set to small value (e.g., 10000) for quick testing
max_samples: null
# Disable streaming mode - use epoch control with patched tokenization
# OCRVL template avoids eager image loading during tokenization
streaming: false
# Enable sequence packing to reduce padding waste
packing: true
preprocessing_num_workers: 4
dataloader_num_workers: 4

### eval
# Use transparent evaluation dataset (14 samples with ground truth)
eval_dataset: ocrvl_transparent_eval
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500  # Run transparent evaluation every 500 steps
predict_with_generate: true

### output
# Base output directory (timestamp will be added automatically by training script)
# Or override via command line: output_dir=path/to/checkpoint
output_dir: OCRVL/checkpoints/llamafactory/qwen3vl-2b/lora/unified_sft_thinking
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false  # Don't overwrite existing checkpoints
save_only_model: false
report_to: none

### train
# Batch size configuration
per_device_train_batch_size: 4  # 4 × 8 GPUs = 32 global batch
gradient_accumulation_steps: 8  # 8 grad accum to maintain 256 effective batch
dataloader_drop_last: true

# Learning rate: Use VQA learning rate for unified SFT
learning_rate: 2.0e-4

# Training duration
num_train_epochs: 4.0

# Scheduler configuration
lr_scheduler_type: cosine
warmup_ratio: 0.1

# Mixed precision and distributed training
bf16: true
pure_bf16: true  # Keep trainable params in bfloat16 (required for FSDP uniform dtype)

# FSDP configuration (8 GPUs recommended)
# sitecustomize.py patches PEFT auto-wrap policy for this custom model
fsdp:
  - full_shard
  - auto_wrap
fsdp_config:
  fsdp_auto_wrap_policy: SIZE_BASED_WRAP
  fsdp_min_num_params: 100000
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_use_orig_params: true
  fsdp_cpu_ram_efficient_loading: false
  fsdp_sync_module_states: true

# DDP configuration
ddp_find_unused_parameters: false
ddp_timeout: 180000000
resume_from_checkpoint: null

# No LoRA preload - start fresh from Thinking model base checkpoint
# To load a previous checkpoint, set adapter_name_or_path:
#   adapter_name_or_path: OCRVL/checkpoints/llamafactory/qwen3vl-2b/lora/alignment/checkpoint-311
adapter_name_or_path: null
